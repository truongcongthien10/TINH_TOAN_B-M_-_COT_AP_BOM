<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Toán Cột Áp Và Công Suất Máy Bơm</title>
    <!-- Giao diện Bootstrap cho đẹp mắt -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; }
        .card-header { background-color: #0d6efd; color: white; font-weight: bold; }
        .result-box { background-color: #e9ecef; font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4 text-primary fw-bold">TÍNH TOÁN CỘT ÁP BƠM VÀ CÔNG SUẤT MÁY BƠM</h2>
    
    <div class="row g-4">
        <!-- CỘT NHẬP DỮ LIỆU ĐẦU VÀO -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">DỮ LIỆU ĐẦU VÀO</div>
                <div class="card-body">
                    <form id="pumpForm">
                        <div class="mb-3">
                            <label class="form-label">Lưu lượng tính toán (m³/ngày đêm)</label>
                            <input type="number" class="form-control" id="Q_day" value="10000" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Đường kính tuyến ống (mm)</label>
                            <input type="number" class="form-control" id="D_mm" value="450" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Chiều dài đường ống (m)</label>
                            <input type="number" class="form-control" id="L" value="18700" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vật liệu đường ống</label>
                            <select class="form-select" id="material" onchange="updateC()">
                                <option value="150">Ống PVC (C = 150)</option>
                                <option value="140" selected>Ống HDPE (C = 140)</option>
                                <option value="130">Ống gang dẻo mới (C = 130)</option>
                                <option value="120">Ống gang dẻo phục hồi / Thép mới (C = 120)</option>
                                <option value="110">Ống thép phục hồi / Gang xám (C = 110)</option>
                                <option value="90">Ống thép cũ (C = 90)</option>
                                <option value="110">Ống bê tông xi măng (C = 110)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hệ số C (Hazen-Williams)</label>
                            <input type="number" class="form-control" id="C_val" value="140" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Áp lực yêu cầu điểm đầu (m)</label>
                            <input type="number" class="form-control" id="H_dau" value="40" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Áp lực yêu cầu điểm cuối (m)</label>
                            <input type="number" class="form-control" id="H_cuoi" value="15" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cao độ điểm đầu Z đầu (m)</label>
                            <input type="number" class="form-control" id="Z_dau" value="3" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cao độ điểm cuối Z cuối (m)</label>
                            <input type="number" class="form-control" id="Z_cuoi" value="6" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hiệu suất làm việc của máy bơm (η)</label>
                            <input type="number" class="form-control" id="efficiency" value="0.75" step="0.01" min="0.1" max="1" required>
                        </div>
                        <button type="button" class="btn btn-primary w-100 fw-bold" onclick="calculatePump()">TÍNH TOÁN NGAY</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- CỘT KẾT QUẢ TÍNH TOÁN -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header bg-success">KẾT QUẢ TÍNH TOÁN</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Lưu lượng tính toán Q (m³/s)</label>
                        <div class="form-control result-box" id="res_Q_s">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vận tốc dòng chảy v (m/s)</label>
                        <div class="form-control result-box" id="res_v">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tổn thất thủy lực trong đường ống Hf (m)</label>
                        <div class="form-control result-box" id="res_Hf">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cột áp tổng máy bơm yêu cầu H (m)</label>
                        <div class="form-control result-box bg-warning text-dark" id="res_H">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Áp lực vận hành sau bơm (m)</label>
                        <div class="form-control result-box" id="res_H_vanhanh">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Công suất điện của máy bơm P (kW)</label>
                        <div class="form-control result-box bg-danger text-white" id="res_P">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Tự động cập nhật ô hệ số C khi chọn vật liệu ống
    function updateC() {
        document.getElementById('C_val').value = document.getElementById('material').value;
    }

    function calculatePump() {
        // 1. Đọc dữ liệu đầu vào
        let Q_day = parseFloat(document.getElementById('Q_day').value);
        let D_mm = parseFloat(document.getElementById('D_mm').value);
        let L = parseFloat(document.getElementById('L').value);
        let C = parseFloat(document.getElementById('C_val').value);
        let H_dau = parseFloat(document.getElementById('H_dau').value);
        let H_cuoi = parseFloat(document.getElementById('H_cuoi').value);
        let Z_dau = parseFloat(document.getElementById('Z_dau').value);
        let Z_cuoi = parseFloat(document.getElementById('Z_cuoi').value);
        let efficiency = parseFloat(document.getElementById('efficiency').value);

        // Đổi đơn vị
        let Q_s = Q_day / 86400; // m3/ngđ -> m3/s
        let D_m = D_mm / 1000;   // mm -> m

        // 2. Tính vận tốc v = Q / A (Diện tích hình tròn A = pi * D^2 / 4)
        let area = Math.PI * Math.pow(D_m, 2) / 4;
        let v = Q_s / area;

        // 3. Tính tổn thất Hazen - Williams (Hf)
        // Công thức chuẩn: Hf = 10.67 * L * Q^1.852 / (C^1.852 * D^4.87)
        let Hf = (10.67 * L * Math.pow(Q_s, 1.852)) / (Math.pow(C, 1.852) * Math.pow(D_m, 4.87));

        // 4. Tính Cột áp tổng yêu cầu H
        // Phương trình năng lượng: H_dau + Z_dau + H_bom = H_cuoi + Z_cuoi + Hf
        // Suy ra H_bom cần đáp ứng = (H_cuoi + Z_cuoi + Hf) - (H_dau + Z_dau)
        let nangLuongDau = H_dau + Z_dau;
        let nangLuongCuoi = H_cuoi + Z_cuoi + Hf;
        let H_req = nangLuongCuoi - nangLuongDau;

        let txt_H = "";
        let txt_P = "";
        let txt_H_vanhanh = "-";

        if (H_req <= 0) {
            txt_H = "Không cần máy bơm (Áp lực tự nhiên đủ)";
            txt_P = "Không cần máy bơm";
            txt_H_vanhanh = H_dau.toFixed(2) + " m";
        } else {
            txt_H = H_req.toFixed(2) + " m";
            // 5. Tính công suất máy bơm P (kW) = (rho * g * Q * H) / (eta * 1000)
            // Với khối lượng riêng nước rho = 1000 kg/m3 và g = 9.81 m/s2 -> tử số là 9810 * Q * H
            let P_kw = (9.81 * 1000 * Q_s * H_req) / (efficiency * 1000);
            txt_P = P_kw.toFixed(2) + " kW";
            txt_H_vanhanh = (H_dau + H_req).toFixed(2) + " m";
        }

        // 6. Hiển thị kết quả lên giao diện web
        document.getElementById('res_Q_s').innerText = Q_s.toFixed(4) + " m³/s";
        document.getElementById('res_v').innerText = v.toFixed(3) + " m/s";
        document.getElementById('res_Hf').innerText = Hf.toFixed(2) + " m";
        document.getElementById('res_H').innerText = txt_H;
        document.getElementById('res_H_vanhanh').innerText = txt_H_vanhanh;
        document.getElementById('res_P').innerText = txt_P;
    }

    // Tự động chạy tính toán lần đầu khi vừa tải trang
    window.onload = calculatePump;
</script>

</body>
</html>
